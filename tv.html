<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeção TV Vertical - ADMI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }

        header {
            background-color: rgba(2, 6, 23, 0.85);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid #eab308;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .nome-igreja {
            font-size: 2.2rem;
            font-weight: 800;
            color: #eab308;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        #relogio-tv {
            font-size: 3.2rem;
            font-weight: bold;
            color: #f8fafc;
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .badge-categoria {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 2rem;
            font-weight: bold;
            padding: 12px 35px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .titulo-destaque {
            font-size: 4.8rem;
            font-weight: 900;
            line-height: 1.15;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.6);
            word-wrap: break-word;
            max-width: 95%;
        }

        .subtitulo-destaque {
            font-size: 2.6rem;
            color: #cbd5e1;
            margin-top: 25px;
            font-weight: 400;
        }

        .descanso-titulo {
            font-size: 4.5rem;
            color: #eab308;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .descanso-sub {
            font-size: 2.2rem;
            color: #94a3b8;
        }

        .midia-fullscreen {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        canvas.pdf-canvas-tv {
            max-width: 100%;
            max-height: 100%;
            width: auto !important;
            height: auto !important;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.75);
            background: #ffffff;
        }

        footer {
            background-color: #020617;
            padding: 20px;
            text-align: center;
            border-top: 4px solid #dc2626;
            display: none;
        }

        .cronometro-label {
            font-size: 1.5rem;
            color: #fca5a5;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #tempo-tv {
            font-size: 5.5rem;
            font-weight: 900;
            color: #ffffff;
            font-family: monospace;
        }

        @keyframes piscarAlerta {
            0%, 100% { background-color: #7f1d1d; }
            50% { background-color: #dc2626; }
        }

        .alerta-ativo {
            animation: piscarAlerta 1s infinite;
        }
    </style>
</head>
<body>

    <header>
        <div class="nome-igreja">ADMI - Assembleia de Deus<br>Ministério de Itatiba</div>
        <div id="relogio-tv">00:00:00</div>
    </header>

    <main id="palco-tv">
        <div class="descanso-titulo">SEJAM BEM-VINDOS</div>
        <div class="descanso-sub">Que Deus abençoe a sua vida!</div>
    </main>

    <footer id="rodape-cronometro">
        <div class="cronometro-label">Tempo Restante</div>
        <div id="tempo-tv">40:00</div>
    </footer>

    <script>
        const canalTV = new BroadcastChannel('canal_igreja_admi');
        let pdfDocAtual = null;
        let bufferAnterior = null;

        function atualizarRelogioTV() {
            const agora = new Date();
            document.getElementById('relogio-tv').innerText = agora.toLocaleTimeString('pt-BR');
        }
        setInterval(atualizarRelogioTV, 1000);
        atualizarRelogioTV();

        canalTV.onmessage = function(evento) {
            const mensagem = evento.data;

            if (mensagem.acao === 'atualizar') {
                renderizarTela(mensagem.dados);
            } else if (mensagem.acao === 'toggle_video') {
                const video = document.getElementById('video-projetado');
                if (video) {
                    video.paused ? video.play() : video.pause();
                }
            }
        };

        function buffersIguais(a, b) {
            if (!a || !b || a.byteLength !== b.byteLength) return false;
            const va = new Uint8Array(a);
            const vb = new Uint8Array(b);
            for (let i = 0; i < va.length; i++) {
                if (va[i] !== vb[i]) return false;
            }
            return true;
        }

        async function renderizarPaginaPdfNaTV(pdfBytes, paginaNum) {
            const palco = document.getElementById('palco-tv');
            palco.innerHTML = `<canvas id="canvas-pdf-tv" class="pdf-canvas-tv"></canvas>`;
            const canvas = document.getElementById('canvas-pdf-tv');
            const ctx = canvas.getContext('2d');

            if (!pdfDocAtual || !buffersIguais(bufferAnterior, pdfBytes)) {
                bufferAnterior = pdfBytes.slice(0);
                pdfDocAtual = await pdfjsLib.getDocument({
                    data: new Uint8Array(pdfBytes.slice(0)),
                    disableWorker: true
                }).promise;
            }

            const paginaSegura = Math.min(Math.max(1, paginaNum || 1), pdfDocAtual.numPages);
            const page = await pdfDocAtual.getPage(paginaSegura);
            const viewport = page.getViewport({ scale: 2.0 });

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;
        }

        function renderizarTela(dados) {
            const palco = document.getElementById('palco-tv');
            const rodapeCrono = document.getElementById('rodape-cronometro');
            const tempoTv = document.getElementById('tempo-tv');

            if (dados.tipo === 'descanso') {
                palco.innerHTML = `
                    <div class="descanso-titulo">SEJAM BEM-VINDOS</div>
                    <div class="descanso-sub">Que Deus abençoe a sua vida!</div>
                `;
            } else if (dados.tipo === 'texto') {
                palco.innerHTML = `
                    <div class="badge-categoria">${dados.categoria}</div>
                    <div class="titulo-destaque">${dados.titulo}</div>
                    ${dados.subtitulo ? `<div class="subtitulo-destaque">${dados.subtitulo}</div>` : ''}
                `;
            } else if (dados.tipo === 'imagem') {
                palco.innerHTML = `<img src="${dados.arquivoUrl}" class="midia-fullscreen" alt="Imagem Projetada">`;
            } else if (dados.tipo === 'video') {
                palco.innerHTML = `<video id="video-projetado" src="${dados.arquivoUrl}" class="midia-fullscreen" autoplay loop controls></video>`;
            } else if (dados.tipo === 'pdf') {
                if (!dados.pdfBytes) {
                    palco.innerHTML = `<p style="font-size:2rem;color:#f87171;">PDF sem dados recebidos.</p>`;
                } else {
                    renderizarPaginaPdfNaTV(dados.pdfBytes, dados.paginaPdf || 1).catch(() => {
                        palco.innerHTML = `<p style="font-size:2rem;color:#f87171;">Não foi possível carregar este PDF.</p>`;
                    });
                }
            }

            if (dados.mostrarCronometro) {
                rodapeCrono.style.display = 'block';
                tempoTv.innerText = dados.tempoFormatado;

                if (dados.alertaTempo) {
                    rodapeCrono.classList.add('alerta-ativo');
                } else {
                    rodapeCrono.classList.remove('alerta-ativo');
                }
            } else {
                rodapeCrono.style.display = 'none';
            }
        }
    </script>
</body>
</html>
